name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        uses: hacs/action@main
        with:
          category: integration

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release ZIP
        run: |
          zip -r adsb_nearby.zip custom_components/adsb_nearby/ -x "*/__pycache__/*" -x "*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: adsb_nearby.zip
          generate_release_notes: true
